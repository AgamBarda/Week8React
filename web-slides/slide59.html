<!DOCTYPE html>
<html>
<head>
  <title>Button Event Listener</title>
</head>
<body>

  <button id="myButton">Click me</button>

  <script type="text/javascript">
    const btn = document.getElementById('myButton');

    btn.addEventListener('click', function() {
      alert('Button Clicked!');
    });
  </script>

</body>
</html>
